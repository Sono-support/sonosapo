<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カレンダー | ソノサポ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0C0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
.cal{background:var(--dark);border:1px solid var(--border);border-radius:18px;padding:12px 10px 10px;margin-top:6px;}
.cal-top{display:flex;align-items:center;gap:6px;padding:0 4px 10px;}
.cal-month{font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:.06em;flex:1;}
.cal-nav{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);}
.cal-today{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow div{text-align:center;font-size:10.5px;color:var(--dim);font-weight:700;padding:4px 0;}
.cal-dow div:first-child{color:#E07070;} .cal-dow div:last-child{color:#6FA8E0;}
.cell{min-height:58px;border-radius:9px;padding:4px 3px;background:rgba(255,255,255,.015);border:1px solid transparent;cursor:pointer;overflow:hidden;}
.cell.empty{background:transparent;cursor:default;}
.cell.today .dn{background:var(--orange);color:var(--black);}
.cell.sel{border-color:var(--orange);}
.dn{font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;color:var(--muted);}
.mini{font-size:9px;line-height:1.25;border-radius:4px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 4px 0;}
.legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

.agenda-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;}
.agenda-h b{font-size:14px;}
.evt{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.evt:active{border-color:var(--orange);}
.evt-date{width:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.evt-date .d{font-family:"Bebas Neue",sans-serif;font-size:24px;line-height:1;}
.evt-date .m{font-size:10px;font-weight:700;}
.evt-body{flex:1;min-width:0;}
.evt-title{font-size:14px;font-weight:800;line-height:1.4;}
.evt-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;}
.cat{font-size:10px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px;white-space:nowrap;}
.scope{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;border:1px solid var(--border-light);color:var(--muted);}
.scope.univ{border-color:rgba(143,166,232,.5);color:var(--navy-light);}

.d-row{display:flex;gap:10px;font-size:13.5px;margin-bottom:7px;color:var(--text);}
.d-row .ic{width:20px;text-align:center;flex-shrink:0;}
.d-desc{margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.d-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.d-sec-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:8px;}
.att-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.att-chip{font-size:11.5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px;}
.att-chip.me{border-color:var(--orange);color:var(--orange-light);}
.att-chip small{color:var(--dim);margin-left:4px;}
.imp{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:7px;}
.imp .text-body{font-size:13px;margin-top:4px;}
.cat-pick{display:flex;flex-wrap:wrap;gap:6px;}
.cat-pick button{border:1px solid var(--border-light);background:var(--black);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;}
</style>
</head>
<body>

<div class="page-head">
  <div><div class="page-title">カレンダー</div><div class="page-sub">PSMA ・ 大学間交流 ・ 学内の予定</div></div>
</div>

<div class="wrap">
  <div class="seg" id="scope-seg">
    <button type="button" data-s="all" class="on">すべて</button>
    <button type="button" data-s="national">全国</button>
    <button type="button" data-s="university" id="seg-univ">自大学</button>
  </div>

  <div class="cal">
    <div class="cal-top">
      <div class="cal-month" id="month"></div>
      <button class="cal-today" id="go-today">今日</button>
      <button class="cal-nav" id="prev" aria-label="前の月">‹</button>
      <button class="cal-nav" id="next" aria-label="次の月">›</button>
    </div>
    <div class="cal-dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="cal-grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="agenda-h"><b id="agenda-label">今後の予定</b><button class="btn ghost sm hidden" id="clear-sel">すべて表示</button></div>
  <div id="agenda"><div class="loading">読み込み中</div></div>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>予定を追加</button>

<!-- 詳細 -->
<div class="sheet-overlay" id="sheet-detail">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><div class="sheet-title" id="d-title"></div><button class="sheet-close" data-close="sheet-detail">✕</button></div>
    <div class="sheet-body" id="d-body"></div>
  </div>
</div>

<!-- 追加・編集 -->
<div class="sheet-overlay" id="sheet-form" data-sticky="1">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><div class="sheet-title" id="f-head">予定を追加</div><button class="sheet-close" data-close="sheet-form">✕</button></div>
    <div class="sheet-body">
      <label class="label" style="margin-top:0;">公開する範囲</label>
      <div class="seg" id="f-scope"><button type="button" data-s="national" class="on">全国に公開</button><button type="button" data-s="university" id="f-scope-univ">自大学だけ</button></div>
      <label class="label">種類</label>
      <div class="cat-pick" id="f-cat"></div>
      <label class="label">イベント名 <span class="req">*</span></label>
      <input class="field" id="f-title" maxlength="60" placeholder="例：PSMA 冬のハンズオン">
      <label class="label">日付 <span class="req">*</span></label>
      <input class="field" id="f-date" type="date">
      <label class="label">時間</label>
      <input class="field" id="f-time" maxlength="30" placeholder="例：13:00〜17:00">
      <label class="label">場所</label>
      <input class="field" id="f-loc" maxlength="60" placeholder="例：浜松医科大学／オンライン">
      <label class="label">申込・詳細のURL</label>
      <input class="field" id="f-url" type="url" placeholder="https://">
      <label class="label">定員（空欄なら制限なし）</label>
      <input class="field" id="f-cap" type="number" min="1" inputmode="numeric">
      <label class="label">説明</label>
      <textarea class="field" id="f-desc" maxlength="1500"></textarea>
      <div class="msg" id="f-msg"></div>
      <button class="btn block" style="margin-top:14px;" id="f-save">保存する</button>
    </div>
  </div>
</div>

<script>
// ---------- 種類と色（増やすときはここに1行足すだけ） ----------
const CATS = [
  { key:'PSMA',       color:'#FF9305' },
  { key:'大学間交流', color:'#5AA7E8' },
  { key:'セミナー',   color:'#E0606A' },
  { key:'自大学',     color:'#6CC58A' },
  { key:'その他',     color:'#B49BE8' },
];
const catOf = k => CATS.find(c => c.key === k) || CATS[CATS.length - 1];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DOW = ['日','月','火','水','木','金','土'];
let EVENTS = [], scope = 'all', vy, vm, sel = null, editing = null;
const now = new Date(); vy = now.getFullYear(); vm = now.getMonth();
const ds = (y, m, d) => `${y}-${SS.pad(m + 1)}-${SS.pad(d)}`;
const todayStr = () => ds(now.getFullYear(), now.getMonth(), now.getDate());
const visible = () => EVENTS.filter(e => scope === 'all' || e.scope === scope);

async function load(){
  const { data, error } = await sb.from('events').select('*').order('event_date').order('event_time', { nullsFirst: true });
  if(error){ SS.$('#agenda').innerHTML = '<div class="empty">読み込めませんでした</div>'; return; }
  EVENTS = data || []; renderCal(); renderAgenda();
}
function renderCal(){
  SS.$('#month').textContent = vy + ' ' + MONTHS[vm];
  const first = new Date(vy, vm, 1).getDay(), days = new Date(vy, vm + 1, 0).getDate(), t = todayStr();
  let h = ''; for(let i = 0; i < first; i++) h += '<div class="cell empty"></div>';
  for(let d = 1; d <= days; d++){
    const s = ds(vy, vm, d), es = visible().filter(e => e.event_date === s);
    h += `<div class="cell${s === t ? ' today' : ''}${s === sel ? ' sel' : ''}" data-d="${s}"><div class="dn">${d}</div>`
      + es.slice(0, 2).map(e => { const c = catOf(e.category); return `<div class="mini" style="color:${c.color};background:${c.color}22;">${SS.esc(e.title)}</div>`; }).join('')
      + (es.length > 2 ? `<div class="mini" style="color:var(--muted);">+${es.length - 2}</div>` : '') + '</div>';
  }
  SS.$('#grid').innerHTML = h;
  SS.$$('#grid .cell[data-d]').forEach(c => c.onclick = () => { sel = sel === c.dataset.d ? null : c.dataset.d; renderCal(); renderAgenda(); });
}
function fmtDay(s){ const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}（${DOW[d.getDay()]}）`; }
function renderAgenda(){
  let items;
  if(sel){ SS.$('#agenda-label').textContent = fmtDay(sel) + ' の予定'; items = visible().filter(e => e.event_date === sel); }
  else { SS.$('#agenda-label').textContent = '今後の予定'; items = visible().filter(e => e.event_date >= todayStr()).slice(0, 30); }
  SS.$('#clear-sel').classList.toggle('hidden', !sel);
  SS.$('#agenda').innerHTML = items.length ? items.map(e => {
    const c = catOf(e.category), d = new Date(e.event_date + 'T00:00:00');
    return `<div class="evt" data-id="${e.id}" style="border-left:3px solid ${c.color};">
      <div class="evt-date" style="background:${c.color}1F;color:${c.color};"><div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()]}</div></div>
      <div class="evt-body">
        <div class="evt-title">${SS.esc(e.title)}<span class="cat" style="color:${c.color};background:${c.color}1F;">${SS.esc(c.key)}</span></div>
        <div class="evt-meta"><span class="scope${e.scope === 'university' ? ' univ' : ''}">${e.scope === 'university' ? '自大学' : '全国'}</span>${e.event_time ? `<span>🕐 ${SS.esc(e.event_time)}</span>` : ''}${e.location ? `<span>📍 ${SS.esc(e.location)}</span>` : ''}</div>
      </div></div>`;
  }).join('') : '<div class="empty">予定はまだありません。<br>右下の「予定を追加」から登録できます。</div>';
  SS.$$('#agenda .evt').forEach(el => el.onclick = () => openDetail(el.dataset.id));
}
SS.$('#prev').onclick = () => { if(--vm < 0){ vm = 11; vy--; } renderCal(); };
SS.$('#next').onclick = () => { if(++vm > 11){ vm = 0; vy++; } renderCal(); };
SS.$('#go-today').onclick = () => { vy = now.getFullYear(); vm = now.getMonth(); sel = todayStr(); renderCal(); renderAgenda(); };
SS.$('#clear-sel').onclick = () => { sel = null; renderCal(); renderAgenda(); };
SS.$$('#scope-seg button').forEach(b => b.onclick = () => { scope = b.dataset.s; SS.$$('#scope-seg button').forEach(x => x.classList.toggle('on', x === b)); renderCal(); renderAgenda(); });
SS.$('#legend').innerHTML = CATS.map(c => `<span><i style="background:${c.color}"></i>${c.key}</span>`).join('');

// ---------- 詳細 ----------
async function openDetail(id){
  const e = EVENTS.find(x => x.id === id); if(!e) return;
  const c = catOf(e.category), d = new Date(e.event_date + 'T00:00:00');
  const mine = e.created_by === SS.user.id;
  SS.$('#d-title').textContent = e.title;
  SS.$('#d-body').innerHTML = `
    <div style="margin-bottom:12px;"><span class="cat" style="margin:0;color:${c.color};background:${c.color}1F;border:1px solid ${c.color}55;">${SS.esc(c.key)}</span> <span class="scope${e.scope === 'university' ? ' univ' : ''}">${e.scope === 'university' ? '自大学だけ' : '全国に公開'}</span></div>
    <div class="d-row"><span class="ic">📅</span>${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${DOW[d.getDay()]}）</div>
    ${e.event_time ? `<div class="d-row"><span class="ic">🕐</span>${SS.esc(e.event_time)}</div>` : ''}
    ${e.location ? `<div class="d-row"><span class="ic">📍</span>${SS.esc(e.location)}</div>` : ''}
    ${e.capacity ? `<div class="d-row"><span class="ic">👥</span>定員 ${e.capacity}人</div>` : ''}
    ${e.url ? `<div class="d-row"><span class="ic">🔗</span><a href="${SS.esc(e.url)}" target="_blank" rel="noopener" style="color:var(--orange-light);word-break:break-all;">${SS.esc(e.url)}</a></div>` : ''}
    ${e.description ? `<div class="d-desc text-body" style="font-size:13px;">${SS.linkify(e.description)}</div>` : ''}
    <div class="hint">登録：${SS.esc(e.created_by_name || '')}${e.created_by_univ ? '（' + SS.esc(e.created_by_univ) + '）' : ''}</div>
    ${(mine || SS.isAdmin()) ? `<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn ghost sm" id="d-edit">編集</button><button class="btn danger sm" id="d-del">削除</button></div>` : ''}
    <div class="d-sec"><div class="d-sec-h"><span>参加</span><span id="att-count" class="mono" style="font-size:11px;color:var(--muted);"></span></div><div id="att-box"><div class="loading"></div></div></div>
    <div class="d-sec"><div class="d-sec-h">感想・学んだこと</div><div id="imp-list"><div class="loading"></div></div>
      <textarea class="field" id="imp-text" maxlength="1000" placeholder="どんな会だったか、学んだことを残そう" style="min-height:70px;"></textarea>
      <label class="check"><input type="checkbox" id="imp-anon">匿名で投稿する</label>
      <button class="btn sm" style="margin-top:10px;" id="imp-send">投稿する</button></div>`;
  SS.openSheet('sheet-detail');
  const de = SS.$('#d-edit'); if(de) de.onclick = () => { SS.closeSheet('sheet-detail'); openForm(e); };
  const dd = SS.$('#d-del'); if(dd) dd.onclick = async () => { if(!confirm('この予定を削除しますか？')) return; const { error } = await sb.from('events').delete().eq('id', e.id); if(error) return SS.toast(SS.friendly(error)); SS.closeSheet('sheet-detail'); load(); };
  SS.$('#imp-send').onclick = async () => {
    const t = SS.$('#imp-text').value.trim(); if(!t) return;
    const { error } = await sb.from('event_impressions').insert({ event_id: e.id, body: t, is_anonymous: SS.$('#imp-anon').checked });
    if(error) return SS.toast(SS.friendly(error));
    SS.$('#imp-text').value = ''; loadImps(e);
  };
  loadAtt(e); loadImps(e);
}
async function loadAtt(e){
  const { data } = await sb.from('event_attendances').select('*').eq('event_id', e.id).order('created_at');
  const rows = data || [], me = rows.find(r => r.user_id === SS.user.id);
  const cap = e.capacity || null, full = cap && rows.length >= cap, open = todayStr() < e.event_date;
  SS.$('#att-count').textContent = cap ? `${rows.length}/${cap}人` : (rows.length ? rows.length + '人' : '');
  let btn;
  if(!open) btn = `<div class="hint">受付は前日までです${me ? '（あなたは参加予定）' : ''}</div>`;
  else if(me) btn = `<button class="btn ghost sm" id="att-btn">参加をとりやめる</button>`;
  else if(full) btn = `<button class="btn sm" disabled>満席です</button>`;
  else btn = `<button class="btn sm" id="att-btn">参加する</button>`;
  SS.$('#att-box').innerHTML = btn + `<div class="att-chips">${rows.map(r => `<span class="att-chip${r.user_id === SS.user.id ? ' me' : ''}">${SS.esc(r.user_name)}<small>${SS.esc(r.user_univ || '')}</small></span>`).join('') || '<span class="hint" style="margin:0;">まだ誰もいません</span>'}</div>`;
  const b = SS.$('#att-btn');
  if(b) b.onclick = async () => {
    b.disabled = true;
    const r = me ? await sb.from('event_attendances').delete().eq('id', me.id) : await sb.from('event_attendances').insert({ event_id: e.id });
    if(r.error) SS.toast(SS.friendly(r.error));
    loadAtt(e);
  };
}
async function loadImps(e){
  await SS.loadOwned();
  const { data } = await sb.from('event_impressions').select('*').eq('event_id', e.id).order('created_at');
  SS.$('#imp-list').innerHTML = (data || []).map(r => `<div class="imp"><div class="au">${SS.authorHtml(r)}<span class="au-time">${SS.ago(r.created_at)}</span></div>
    <div class="text-body">${SS.linkify(r.body)}</div>${(SS.owns(r.id) || SS.isAdmin()) ? `<button class="btn ghost sm" style="margin-top:6px;" data-delimp="${r.id}">削除</button>` : ''}</div>`).join('')
    || '<div class="hint" style="margin:0 0 8px;">まだありません</div>';
  SS.$$('[data-delimp]').forEach(b => b.onclick = async () => { if(!confirm('削除しますか？')) return; await sb.from('event_impressions').delete().eq('id', b.dataset.delimp); loadImps(e); });
}

// ---------- 追加・編集 ----------
let fScope = 'national', fCat = 'PSMA';
function drawFormPicks(){
  SS.$$('#f-scope button').forEach(b => b.classList.toggle('on', b.dataset.s === fScope));
  SS.$('#f-cat').innerHTML = CATS.map(c => `<button type="button" data-c="${c.key}" style="${c.key === fCat ? `background:${c.color};border-color:${c.color};color:#0C0C0C;` : ''}">${c.key}</button>`).join('');
  SS.$$('#f-cat button').forEach(b => b.onclick = () => { fCat = b.dataset.c; drawFormPicks(); });
}
SS.$$('#f-scope button').forEach(b => b.onclick = () => { fScope = b.dataset.s; drawFormPicks(); });
function openForm(e){
  editing = e || null;
  SS.$('#f-head').textContent = e ? '予定を編集' : '予定を追加';
  fScope = e ? e.scope : 'national'; fCat = e ? catOf(e.category).key : 'PSMA';
  SS.$('#f-title').value = e ? e.title : '';
  SS.$('#f-date').value = e ? e.event_date : (sel || todayStr());
  SS.$('#f-time').value = e ? (e.event_time || '') : '';
  SS.$('#f-loc').value = e ? (e.location || '') : '';
  SS.$('#f-url').value = e ? (e.url || '') : '';
  SS.$('#f-cap').value = e && e.capacity ? e.capacity : '';
  SS.$('#f-desc').value = e ? (e.description || '') : '';
  drawFormPicks(); SS.msg('f-msg'); SS.openSheet('sheet-form');
}
SS.$('#fab').onclick = () => openForm(null);
SS.$('#f-save').onclick = async () => {
  const title = SS.$('#f-title').value.trim(), date = SS.$('#f-date').value, url = SS.$('#f-url').value.trim();
  const capRaw = SS.$('#f-cap').value.trim(), cap = capRaw ? parseInt(capRaw, 10) : null;
  if(!title || !date){ SS.msg('f-msg', 'イベント名と日付は必須です。'); return; }
  if(url && !/^https?:\/\//.test(url)){ SS.msg('f-msg', 'URL は http から始まる形で入力してください。'); return; }
  if(capRaw && !(cap >= 1)){ SS.msg('f-msg', '定員は1以上の数字にしてください。'); return; }
  const row = { title, event_date: date, event_time: SS.$('#f-time').value.trim() || null, location: SS.$('#f-loc').value.trim() || null,
    url: url || null, capacity: cap, description: SS.$('#f-desc').value.trim() || null, category: fCat, scope: fScope };
  const btn = SS.$('#f-save'); btn.disabled = true;
  const r = editing ? await sb.from('events').update(row).eq('id', editing.id) : await sb.from('events').insert(row);
  btn.disabled = false;
  if(r.error){ SS.msg('f-msg', SS.friendly(r.error)); return; }
  SS.closeSheet('sheet-form'); SS.toast('保存しました'); load();
};

SS.boot().then(() => {
  SS.tabbar('calendar');
